<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Dojo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Nunito:ital,wght@0,400;0,600;0,700;0,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top-nav">
    <span class="welcome" id="welcome-name">&nbsp;</span>
    <div style="display:flex; gap:8px;">
      <a href="stats.html" class="btn-secondary" style="text-decoration:none; display:inline-block;">My Stats</a>
      <button class="btn-secondary" id="logout-btn">Log out</button>
    </div>
  </div>
  <div class="brand">🥋 Reading Dojo</div>
  <div id="screen"></div>
</div>

<script src="shared/supabase-client.js"></script>
<script src="shared/loading-game.js"></script>
<script src="shared/soccer-game.js"></script>
<script src="shared/runner-game.js"></script>
<script>
const YEAR_LEVELS = [
  { year: 2, age: 'Ages 6-7' }, { year: 3, age: 'Ages 7-8' }, { year: 4, age: 'Ages 8-9' },
  { year: 5, age: 'Ages 9-10' }, { year: 6, age: 'Ages 10-11' }, { year: 7, age: 'Ages 11-12' },
  { year: 8, age: 'Ages 12-13' }, { year: 9, age: 'Ages 13-14' }, { year: 10, age: 'Ages 14-15' },
];

const LOADING_MESSAGES = {
  passage: 'Writing your reading challenge...',
  scoring: 'Listening back to your reading...',
  grading: 'Marking your answers...',
};

const state = {
  screen: 'setup',
  topic: '',
  year: null,
  genre: null, // 'fiction' | 'nonfiction'
  session: null,     // { sessionId, title, passage, questions }
  recording: false,
  mediaRecorder: null,
  audioChunks: [],
  recordStart: null,
  recordTimer: null,
  elapsedSeconds: 0,
  readingStats: null, // { accuracyPct, wpm, durationSeconds, transcript }
  qIndex: 0,
  answers: [],         // { questionId, answer }
  quizResults: null,   // { results, correctCount, total }
  showPassageRef: false,
  showPreRecordCheck: false,
  checklistSkim: false,
  checklistWords: false,
  errorMsg: '',
};

const screenEl = document.getElementById('screen');

// The loading mini-games (shared/loading-game.js, soccer-game.js,
// runner-game.js) mount fresh on every loading screen and must be torn
// down the instant we leave it — this single teardown point at the top
// of render() guarantees that regardless of which screen comes next, so
// the game stops immediately once the real content (passage/score/grade)
// is ready. Which one shows is picked at random each time: basketball is
// the default (60%), with the soccer and runner games each showing 20%
// of the time for variety.
let activeLoadingGame = null;

function pickLoadingGame() {
  const r = Math.random();
  if (r < 0.6) return window.LoadingGame;
  if (r < 0.8) return window.SoccerGame;
  return window.RunnerGame;
}

function setState(patch) {
  Object.assign(state, patch);
  render();
}

function render() {
  if (activeLoadingGame) {
    activeLoadingGame.destroy();
    activeLoadingGame = null;
  }
  if (state.screen === 'setup') return renderSetup();
  if (state.screen === 'loading-passage') return renderLoading('passage');
  if (state.screen === 'passage') return renderPassage();
  if (state.screen === 'scoring') return renderLoading('scoring');
  if (state.screen === 'reading-results') return renderReadingResults();
  if (state.screen === 'quiz') return renderQuiz();
  if (state.screen === 'grading') return renderLoading('grading');
  if (state.screen === 'results') return renderResults();
}

// ---------------- Setup ----------------
function renderSetup() {
  screenEl.innerHTML = `
    <div class="card">
      <label class="field-label" for="topic-input">What do you want to read about?</label>
      <input type="text" id="topic-input" placeholder="e.g. most money ever made in Fortnite" maxlength="200" value="${escapeHtml(state.topic)}" />
      <div class="hint">Pick any topic you like — the dojo will turn it into a reading passage.</div>
      <div class="genre-toggle" id="genre-toggle">
        <button type="button" class="genre-btn ${state.genre === 'fiction' ? 'selected' : ''}" data-genre="fiction">Fiction</button>
        <button type="button" class="genre-btn ${state.genre === 'nonfiction' ? 'selected' : ''}" data-genre="nonfiction">Non-Fiction</button>
      </div>
    </div>
    <div class="card">
      <label class="field-label">Choose your year level</label>
      <div class="year-grid" id="year-grid">
        ${YEAR_LEVELS.map(yl => `
          <button type="button" class="year-btn ${state.year === yl.year ? 'selected' : ''}" data-year="${yl.year}">
            <span class="yb-num">Y${yl.year}</span>
            <span class="yb-age">${yl.age}</span>
          </button>
        `).join('')}
      </div>
      <div class="error">${escapeHtml(state.errorMsg)}</div>
      <button class="btn-primary" id="start-btn">Generate My Passage</button>
    </div>
  `;

  document.getElementById('topic-input').addEventListener('input', (e) => { state.topic = e.target.value; });
  document.querySelectorAll('.genre-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.genre = btn.dataset.genre;
      document.querySelectorAll('.genre-btn').forEach((b) => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });
  document.querySelectorAll('.year-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.year = parseInt(btn.dataset.year, 10);
      document.querySelectorAll('.year-btn').forEach((b) => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });
  document.getElementById('start-btn').addEventListener('click', generatePassage);
}

async function generatePassage() {
  const topic = state.topic.trim();
  if (!topic) { setState({ errorMsg: 'Type a topic first.' }); return; }
  if (!state.genre) { setState({ errorMsg: 'Choose Fiction or Non-Fiction.' }); return; }
  if (!state.year) { setState({ errorMsg: 'Choose a year level.' }); return; }

  setState({ screen: 'loading-passage', errorMsg: '' });

  try {
    const data = await authedFetch('/.netlify/functions/create-passage', {
      method: 'POST',
      body: JSON.stringify({ topic: topic, yearLevel: state.year, genre: state.genre }),
    });
    setState({
      screen: 'passage',
      session: data,
      recording: false,
      readingStats: null,
      qIndex: 0,
      answers: [],
      quizResults: null,
    });
  } catch (e) {
    setState({ screen: 'setup', errorMsg: e.blocked ? e.message : "Couldn't build that passage — try again." });
  }
}

// ---------------- Loading ----------------
function renderLoading(kind) {
  screenEl.innerHTML = `
    <div class="card">
      <div class="loading-msg" style="padding:0 0 16px;">${LOADING_MESSAGES[kind]}</div>
      <div id="loading-game-slot"></div>
    </div>
  `;
  // Guard in case a game script failed to load for some reason — the
  // loading message above still works fine on its own.
  const game = pickLoadingGame();
  if (game) {
    activeLoadingGame = game.mount(document.getElementById('loading-game-slot'));
  }
}

// ---------------- Passage + recording ----------------
function renderPassage() {
  const s = state.session;
  screenEl.innerHTML = `
    <div class="card">
      <div class="record-inline">
        ${state.recording ? `
          <button class="record-btn-sm recording" id="stop-btn" aria-label="Stop recording">&#9632;</button>
          <div class="record-inline-info">
            <div class="record-timer-sm" id="record-timer">${formatTime(state.elapsedSeconds)}</div>
            <button class="btn-secondary" id="stop-btn-2" style="width:auto; margin:0; padding:8px 14px; font-size:12px;">Finished Reading</button>
          </div>
        ` : `
          <button class="record-btn-sm" id="open-record-check-btn" aria-label="Start recording">&#9679;</button>
          <div class="record-inline-info hint" style="margin:0;">Tap to start reading — no time limit.</div>
        `}
      </div>
      <div class="passage-title">${escapeHtml(s.title)}</div>
      <div class="passage-hint">Stuck on a word? Tap it to hear it read aloud — or drag across a few words to hear the whole phrase.</div>
      <div class="passage-text" id="passage-text">${renderClickableWords(s.passage)}</div>
      <div class="error">${escapeHtml(state.errorMsg)}</div>
    </div>
    ${state.showPreRecordCheck ? renderPreRecordModal() : ''}
  `;

  initPassageDragSelect(document.getElementById('passage-text'));

  if (state.recording) {
    document.getElementById('stop-btn').addEventListener('click', stopRecording);
    document.getElementById('stop-btn-2').addEventListener('click', stopRecording);
  } else {
    document.getElementById('open-record-check-btn').addEventListener('click', () => {
      setState({ showPreRecordCheck: true, checklistSkim: false, checklistWords: false });
    });
  }

  if (state.showPreRecordCheck) wirePreRecordModal();
}

// Gate before a boy can start recording: he must tick both checks before
// the (red) Start Recording button becomes usable. Closing the overlay
// (the X, or clicking outside the card) cancels without recording.
function renderPreRecordModal() {
  const bothChecked = state.checklistSkim && state.checklistWords;
  return `
    <div class="modal-overlay" id="pre-record-overlay">
      <div class="modal-card">
        <button type="button" class="modal-close" id="modal-close-btn" aria-label="Close">&times;</button>
        <div class="field-label" style="margin-bottom:6px;">Ready to read?</div>
        <label class="checklist-item">
          <input type="checkbox" id="check-skim" ${state.checklistSkim ? 'checked' : ''} />
          <span>I have skim-read the passage.</span>
        </label>
        <label class="checklist-item">
          <input type="checkbox" id="check-words" ${state.checklistWords ? 'checked' : ''} />
          <span>I have listened to any words I don't know.</span>
        </label>
        <button type="button" class="btn-danger" id="start-recording-btn" ${bothChecked ? '' : 'disabled'}>Start Recording</button>
      </div>
    </div>
  `;
}

function wirePreRecordModal() {
  document.getElementById('modal-close-btn').addEventListener('click', closePreRecordModal);
  document.getElementById('pre-record-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'pre-record-overlay') closePreRecordModal();
  });
  document.getElementById('check-skim').addEventListener('change', (e) => {
    setState({ checklistSkim: e.target.checked });
  });
  document.getElementById('check-words').addEventListener('change', (e) => {
    setState({ checklistWords: e.target.checked });
  });
  const startBtn = document.getElementById('start-recording-btn');
  if (!startBtn.disabled) {
    startBtn.addEventListener('click', () => {
      state.showPreRecordCheck = false; // no re-render here — startRecording() renders once it has mic access
      startRecording();
    });
  }
}

function closePreRecordModal() {
  setState({ showPreRecordCheck: false, checklistSkim: false, checklistWords: false });
}

// Splits the passage into paragraph blocks (blank-line separated). A block
// starting with "## " (the convention the non-fiction prompt is told to
// use) renders as a styled subheading, not clickable-word text; every other
// block is wrapped word-by-word for tap/drag-to-hear. Each word span's
// data-word is the punctuation-stripped word sent for speech synthesis
// (and used as the audio cache key); displayed text keeps its punctuation.
// data-index numbers word spans sequentially across the WHOLE passage
// (headings don't consume an index) so a drag gesture spanning paragraphs
// still finds the right range.
function renderClickableWords(text) {
  let index = 0;

  function renderWords(segment) {
    return segment
      .split(/(\s+)/)
      .map((tok) => {
        if (!tok) return '';
        if (/^\s+$/.test(tok)) return escapeHtml(tok);
        const clean = tok.replace(/^[^a-zA-Z0-9']+|[^a-zA-Z0-9']+$/g, '');
        if (!clean) return escapeHtml(tok);
        const span = `<span class="word" data-word="${escapeHtml(clean)}" data-index="${index}">${escapeHtml(tok)}</span>`;
        index++;
        return span;
      })
      .join('');
  }

  return text
    .split(/\n\s*\n/)
    .map((block) => {
      const trimmed = block.trim();
      if (!trimmed) return '';
      if (trimmed.startsWith('## ')) {
        return `<div class="passage-subheading">${escapeHtml(trimmed.slice(3).trim())}</div>`;
      }
      return `<p class="passage-para">${renderWords(block)}</p>`;
    })
    .join('');
}

// Non-interactive version for the quiz's "View Passage" reference — same
// paragraph/heading structure, no word-tap audio (it's just for reading
// back over, not a second read-aloud aid).
function renderPassagePlain(text) {
  return text
    .split(/\n\s*\n/)
    .map((block) => {
      const trimmed = block.trim();
      if (!trimmed) return '';
      if (trimmed.startsWith('## ')) {
        return `<div class="passage-subheading">${escapeHtml(trimmed.slice(3).trim())}</div>`;
      }
      return `<p class="passage-para">${escapeHtml(block)}</p>`;
    })
    .join('');
}

const wordAudioCache = new Map();
let currentWordAudio = null;

// Tap a single word → play it (cached per word). Drag across several →
// play the whole phrase in one go, using Pointer Events so mouse, touch,
// and pen all work the same way. document.elementFromPoint (rather than
// pointer capture on the start element) is what lets the drag continue
// tracking correctly as the pointer moves over sibling word spans.
let dragState = null;

function initPassageDragSelect(containerEl) {
  containerEl.addEventListener('pointerdown', (e) => {
    const wordEl = e.target.closest('.word');
    if (!wordEl) return;
    e.preventDefault();
    // Capture so pointermove/pointerup keep reaching this element even if
    // the drag leaves the passage box (or a finger drags past its edge).
    containerEl.setPointerCapture(e.pointerId);
    dragState = { startIndex: Number(wordEl.dataset.index), currentIndex: Number(wordEl.dataset.index) };
    updateSelectionHighlight(containerEl, dragState.startIndex, dragState.currentIndex);
  });

  containerEl.addEventListener('pointermove', (e) => {
    if (!dragState) return;
    const target = document.elementFromPoint(e.clientX, e.clientY);
    const wordEl = target && target.closest && target.closest('.word');
    if (!wordEl || !containerEl.contains(wordEl)) return;
    dragState.currentIndex = Number(wordEl.dataset.index);
    updateSelectionHighlight(containerEl, dragState.startIndex, dragState.currentIndex);
  });

  containerEl.addEventListener('pointerup', () => finishDragSelect(containerEl));
  containerEl.addEventListener('pointercancel', () => {
    dragState = null;
    clearSelectionHighlight(containerEl);
  });
}

function finishDragSelect(containerEl) {
  if (!dragState) return;
  const lo = Math.min(dragState.startIndex, dragState.currentIndex);
  const hi = Math.max(dragState.startIndex, dragState.currentIndex);
  dragState = null;
  clearSelectionHighlight(containerEl);

  const spans = Array.from(containerEl.querySelectorAll('.word')).filter((el) => {
    const idx = Number(el.dataset.index);
    return idx >= lo && idx <= hi;
  });
  if (spans.length === 1) {
    playWord(spans[0].dataset.word, spans);
  } else if (spans.length > 1) {
    playWord(spans.map((el) => el.textContent).join(' '), spans);
  }
}

function updateSelectionHighlight(containerEl, a, b) {
  const lo = Math.min(a, b);
  const hi = Math.max(a, b);
  containerEl.querySelectorAll('.word').forEach((el) => {
    const idx = Number(el.dataset.index);
    el.classList.toggle('selecting', idx >= lo && idx <= hi);
  });
}

function clearSelectionHighlight(containerEl) {
  containerEl.querySelectorAll('.word.selecting').forEach((el) => el.classList.remove('selecting'));
}

// text: the word (single tap, punctuation-stripped) or phrase (drag,
// original punctuation kept for natural intonation) to speak. els: the
// span(s) to highlight while it plays. Only single words are cached —
// dragged phrases are unlikely to repeat exactly.
async function playWord(text, els) {
  if (currentWordAudio) {
    currentWordAudio.pause();
  }
  document.querySelectorAll('.word.playing').forEach((w) => w.classList.remove('playing'));
  els.forEach((el) => el.classList.add('playing'));

  const cacheable = els.length === 1;
  try {
    let url = cacheable ? wordAudioCache.get(text) : null;
    if (!url) {
      const blob = await authedFetchBlob('/.netlify/functions/speak-word', {
        method: 'POST',
        body: JSON.stringify({ text }),
      });
      url = URL.createObjectURL(blob);
      if (cacheable) wordAudioCache.set(text, url);
    }
    currentWordAudio = new Audio(url);
    currentWordAudio.addEventListener('ended', () => els.forEach((el) => el.classList.remove('playing')));
    await currentWordAudio.play();
  } catch (e) {
    els.forEach((el) => el.classList.remove('playing'));
  }
}

function formatTime(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return m + ':' + String(s).padStart(2, '0');
}

async function startRecording() {
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    setState({ errorMsg: 'Recording is not supported in this browser.' });
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    let mediaRecorder;
    try { mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' }); }
    catch (e) { mediaRecorder = new MediaRecorder(stream); }

    state.mediaRecorder = mediaRecorder;
    state.audioChunks = [];

    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) state.audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      handleRecordingStopped();
    };

    mediaRecorder.start();
    state.recordStart = Date.now();
    state.elapsedSeconds = 0;
    clearInterval(state.recordTimer);
    state.recordTimer = setInterval(() => {
      state.elapsedSeconds = Math.floor((Date.now() - state.recordStart) / 1000);
      const timerEl = document.getElementById('record-timer');
      if (timerEl) timerEl.textContent = formatTime(state.elapsedSeconds);
    }, 250);

    setState({ recording: true, errorMsg: '' });
  } catch (e) {
    setState({ errorMsg: 'Microphone access is needed to read aloud — please allow it and try again.' });
  }
}

function stopRecording() {
  clearInterval(state.recordTimer);
  if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
    state.mediaRecorder.stop();
  }
}

async function handleRecordingStopped() {
  const durationMs = Date.now() - state.recordStart;
  const mimeType = state.mediaRecorder.mimeType || 'audio/webm';
  const blob = new Blob(state.audioChunks, { type: mimeType });

  setState({ screen: 'scoring' });

  try {
    const audioBase64 = await blobToBase64(blob);
    const result = await authedFetch('/.netlify/functions/transcribe-and-score', {
      method: 'POST',
      body: JSON.stringify({ sessionId: state.session.sessionId, audioBase64: audioBase64, mimeType: mimeType, durationMs: durationMs }),
    });
    setState({ screen: 'reading-results', readingStats: result });
  } catch (e) {
    setState({ screen: 'passage', recording: false, errorMsg: e.message || 'Something went wrong scoring your reading — try again.' });
  }
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// ---------------- Reading results ----------------
function renderReadingResults() {
  const r = state.readingStats;
  screenEl.innerHTML = `
    <div class="card">
      <h2 style="text-align:center;">Reading Check Complete</h2>
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-num">${r.wpm}</div><div class="stat-label">Words per minute</div></div>
        <div class="stat-box"><div class="stat-num">${r.accuracyPct}%</div><div class="stat-label">Reading accuracy</div></div>
      </div>
      <div class="hint">This is a practice estimate — speech transcription isn't perfect, especially with fast or quiet reading. Not happy with it? Read it again before saving.</div>
      <button class="btn-primary" id="save-continue-btn">Save Score &amp; Continue</button>
      <button class="btn-secondary" id="read-again-btn">Read Again</button>
    </div>
  `;
  document.getElementById('save-continue-btn').addEventListener('click', () => {
    setState({ screen: 'quiz', qIndex: 0, answers: [], showPassageRef: false });
  });
  document.getElementById('read-again-btn').addEventListener('click', () => {
    setState({ screen: 'passage', recording: false, readingStats: null, errorMsg: '' });
  });
}

// ---------------- Quiz ----------------
function renderQuiz() {
  const s = state.session;
  const q = s.questions[state.qIndex];
  const total = s.questions.length;
  const isLast = state.qIndex === total - 1;
  const existingAnswer = state.answers[state.qIndex];

  const bodyHtml = q.type === 'multiple_choice'
    ? `<div class="options" id="options-wrap">
        ${q.options.map((opt, i) => `
          <button type="button" class="option-btn ${existingAnswer && existingAnswer.answer == i ? 'selected' : ''}" data-idx="${i}">
            <span class="opt-letter">${String.fromCharCode(65 + i)}</span>
            <span>${escapeHtml(opt)}</span>
          </button>
        `).join('')}
      </div>`
    : `<textarea id="short-answer-input" placeholder="Type your answer...">${existingAnswer ? escapeHtml(existingAnswer.answer) : ''}</textarea>`;

  screenEl.innerHTML = `
    ${state.showPassageRef ? `
      <div class="card">
        <div class="passage-title" style="font-size:18px;">${escapeHtml(s.title)}</div>
        <div class="passage-text">${renderPassagePlain(s.passage)}</div>
      </div>
    ` : ''}
    <div class="card">
      <div class="quiz-top">
        <div class="quiz-progress">Question ${state.qIndex + 1} of ${total}</div>
        <button type="button" class="btn-secondary" id="toggle-passage-btn" style="width:auto; margin:0; padding:6px 12px; font-size:12px;">${state.showPassageRef ? 'Hide Passage' : 'View Passage'}</button>
      </div>
      <div class="question-text">${escapeHtml(q.question)}</div>
      ${bodyHtml}
      <div class="error" id="quiz-error"></div>
      <button class="btn-primary" id="quiz-next-btn">${isLast ? 'Submit Answers' : 'Next Question'}</button>
      <div class="belt-wrap">
        <div class="belt">
          ${s.questions.map((_, i) => `<div class="stripe-slot ${state.answers[i] ? 'filled' : ''}"></div>`).join('')}
        </div>
      </div>
    </div>
  `;

  document.getElementById('toggle-passage-btn').addEventListener('click', () => {
    setState({ showPassageRef: !state.showPassageRef });
  });

  if (q.type === 'multiple_choice') {
    document.querySelectorAll('.option-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.option-btn').forEach((b) => b.classList.remove('selected'));
        btn.classList.add('selected');
        state.answers[state.qIndex] = { questionId: q.id, answer: btn.dataset.idx };
      });
    });
  }

  document.getElementById('quiz-next-btn').addEventListener('click', () => onQuizNext(q, isLast, total));
}

function onQuizNext(q, isLast, total) {
  if (q.type === 'short_answer') {
    const text = document.getElementById('short-answer-input').value.trim();
    if (!text) { document.getElementById('quiz-error').textContent = 'Write an answer before continuing.'; return; }
    state.answers[state.qIndex] = { questionId: q.id, answer: text };
  } else if (!state.answers[state.qIndex]) {
    document.getElementById('quiz-error').textContent = 'Pick an answer before continuing.';
    return;
  }

  if (isLast) {
    submitQuiz();
  } else {
    setState({ qIndex: state.qIndex + 1 });
  }
}

async function submitQuiz() {
  setState({ screen: 'grading' });
  try {
    const data = await authedFetch('/.netlify/functions/grade-comprehension', {
      method: 'POST',
      body: JSON.stringify({ sessionId: state.session.sessionId, answers: state.answers }),
    });
    setState({ screen: 'results', quizResults: data });
  } catch (e) {
    setState({ screen: 'quiz', qIndex: state.session.questions.length - 1, errorMsg: e.message || 'Something went wrong grading your answers — try again.' });
  }
}

// ---------------- Results ----------------
function renderResults() {
  const s = state.session;
  const results = state.quizResults;
  const byId = Object.fromEntries(results.results.map((r) => [r.questionId, r]));
  const givenAnswerById = Object.fromEntries(state.answers.map((a) => [a.questionId, a.answer]));

  screenEl.innerHTML = `
    <div class="card">
      <h2 style="text-align:center;">${results.correctCount} / ${results.total} Correct</h2>
      <div class="belt-wrap" style="margin-bottom:20px;">
        <div class="belt">
          ${results.results.map((r) => `<div class="stripe-slot ${r.isCorrect ? 'filled' : ''}"></div>`).join('')}
        </div>
      </div>
      ${s.questions.map((q) => {
        const r = byId[q.id];
        if (!r) return '';
        let givenAnswerText = '';
        if (!r.isCorrect) {
          const raw = givenAnswerById[q.id];
          if (q.type === 'multiple_choice') {
            const idx = parseInt(raw, 10);
            givenAnswerText = q.options && q.options[idx] != null ? q.options[idx] : '(no answer given)';
          } else {
            givenAnswerText = raw ? raw : '(no answer given)';
          }
        }
        return `
          <div style="margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid rgba(255,255,255,0.08);">
            <div style="font-weight:800; margin-bottom:6px;">${escapeHtml(q.question)}</div>
            ${!r.isCorrect ? `<div class="hint" style="margin-bottom:6px;">Your answer: ${escapeHtml(givenAnswerText)}</div>` : ''}
            <div class="feedback ${r.isCorrect ? 'right' : 'wrong'}">${r.isCorrect ? 'Correct — ' : 'Not quite — '}${escapeHtml(r.feedback)}</div>
          </div>
        `;
      }).join('')}
      <button class="btn-primary" id="again-btn">Read Another Passage</button>
      <a href="stats.html" class="btn-secondary" style="display:block; text-align:center; text-decoration:none; margin-top:12px;">View My Stats</a>
    </div>
  `;

  document.getElementById('again-btn').addEventListener('click', () => {
    setState({ screen: 'setup', topic: '', year: null, genre: null, session: null, showPassageRef: false, errorMsg: '' });
  });
}

// ---------------- Boot ----------------
(async function init() {
  const session = await requireAuth();
  if (!session) return;

  document.getElementById('logout-btn').addEventListener('click', logout);

  const { data: profile } = await sb.from('profiles').select('display_name').eq('id', session.user.id).maybeSingle();
  document.getElementById('welcome-name').textContent = profile ? 'Welcome, ' + profile.display_name : '';

  render();
})();
</script>
</body>
</html>
