<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Dojo — My Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Nunito:ital,wght@0,400;0,600;0,700;0,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top-nav">
    <a href="dojo.html" class="btn-secondary" style="text-decoration:none; display:inline-block;">&larr; Back to Dojo</a>
    <button class="btn-secondary" id="logout-btn">Log out</button>
  </div>
  <div class="brand">📊 My Reading Stats</div>

  <div class="card">
    <h2 style="text-align:center; font-size:16px; color:var(--grey); text-transform:uppercase; letter-spacing:0.05em;">Overall</h2>
    <div id="overall-body"><div class="loading-msg">Loading...</div></div>
  </div>

  <div class="card" id="latest-card">
    <h2 style="text-align:center; font-size:16px; color:var(--grey); text-transform:uppercase; letter-spacing:0.05em;">Latest Session</h2>
    <div id="latest-body">
      <div class="loading-msg">Loading...</div>
    </div>
  </div>

  <div id="by-year-section"></div>
</div>
<script src="shared/supabase-client.js"></script>
<script>
  (async function init() {
    const session = await requireAuth();
    if (!session) return;

    document.getElementById('logout-btn').addEventListener('click', logout);

    const [{ data: overall }, { data: byYear }, { data: latestRows }] = await Promise.all([
      sb.from('my_reading_stats').select('*').maybeSingle(),
      sb.from('my_reading_stats_by_year').select('*'),
      sb.from('reading_sessions')
        .select('topic,year_level,passage_title,word_count,accuracy_pct,wpm,reading_duration_seconds,created_at')
        .eq('status', 'completed')
        .order('created_at', { ascending: false })
        .limit(1),
    ]);

    document.getElementById('overall-body').innerHTML = renderStatBoxes(overall, 'Texts read');

    const latest = latestRows && latestRows[0];
    const latestBody = document.getElementById('latest-body');
    if (!latest) {
      latestBody.innerHTML = '<div class="hint" style="text-align:center;">No completed sessions yet — go read a passage!</div>';
    } else {
      latestBody.innerHTML =
        '<div class="passage-title" style="font-size:18px;">' + escapeHtml(latest.passage_title || latest.topic) + '</div>' +
        '<div class="hint" style="margin-bottom:14px;">Year ' + latest.year_level + ' &middot; ' + escapeHtml(latest.topic) + '</div>' +
        '<div class="stat-grid">' +
          '<div class="stat-box"><div class="stat-num">' + (latest.wpm != null ? latest.wpm : '—') + '</div><div class="stat-label">Words/min</div></div>' +
          '<div class="stat-box"><div class="stat-num">' + (latest.accuracy_pct != null ? latest.accuracy_pct + '%' : '—') + '</div><div class="stat-label">Accuracy</div></div>' +
        '</div>';
    }

    const byYearSection = document.getElementById('by-year-section');
    if (!byYear || byYear.length === 0) {
      byYearSection.innerHTML = '';
    } else {
      byYearSection.innerHTML =
        '<h2 style="text-align:center; font-size:16px; color:var(--grey); text-transform:uppercase; letter-spacing:0.05em; margin:22px 0 12px;">By Year Level</h2>' +
        byYear.map((row) => `
          <div class="card">
            <h3 style="text-align:center; font-family:var(--display); margin:0 0 4px;">Year ${row.year_level}</h3>
            ${renderStatBoxes(row, 'Texts read')}
          </div>
        `).join('');
    }
  })();

  function renderStatBoxes(stats, sessionLabel) {
    if (!stats) {
      return '<div class="hint" style="text-align:center;">No completed sessions yet.</div>';
    }
    return (
      '<div class="stat-grid">' +
      statBox(stats.session_count, sessionLabel) +
      statBox(stats.total_words, 'Words read') +
      statBox(stats.avg_accuracy_pct != null ? stats.avg_accuracy_pct + '%' : '—', 'Avg accuracy') +
      statBox(stats.avg_wpm != null ? stats.avg_wpm : '—', 'Avg words/min') +
      statBox(stats.avg_correct_wpm != null ? stats.avg_correct_wpm : '—', 'Avg correct words/min') +
      statBox(formatDuration(stats.total_reading_seconds), 'Time reading') +
      statBox(stats.questions_correct, 'Questions correct') +
      statBox(stats.questions_incorrect, 'Questions missed') +
      '</div>'
    );
  }

  function statBox(value, label) {
    return '<div class="stat-box"><div class="stat-num">' + value + '</div><div class="stat-label">' + escapeHtml(label) + '</div></div>';
  }

  function formatDuration(totalSeconds) {
    const s = Math.round(Number(totalSeconds) || 0);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return h + 'h ' + m + 'm ' + sec + 's';
    if (m > 0) return m + 'm ' + sec + 's';
    return sec + 's';
  }
</script>
</body>
</html>
